name: CI

on:
  push:
  pull_request:

jobs:
  # Every PHP file must parse on every supported PHP version. Whisker ships
  # via an auto-updater — a syntax error takes a whole store down, and this
  # repo is developed on machines that may not even have PHP installed.
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: php -l every file
        run: |
          set -o pipefail
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './storage/*' \
            -print0 | xargs -0 -n1 -P4 php -l > /dev/null

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - name: Install dev dependencies (PHPUnit only — the product itself has none)
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Run unit suite
        run: vendor/bin/phpunit --testsuite unit

  # Loads schema.sql into a real database, then runs the migration system the
  # way an upgraded store would. Matrix covers MySQL AND MariaDB because their
  # DDL dialects differ (ADD COLUMN IF NOT EXISTS is MariaDB-only — a shipped
  # migration once used it and wedged on real MySQL).
  integration:
    name: Integration (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: ['mysql:8.0', 'mariadb:10.11']
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: whisker_test
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            if mysql -h127.0.0.1 -uroot -proot -e 'SELECT 1' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo 'database never became ready' >&2
          exit 1
      - name: Write CI config files
        run: |
          cat > config/database.php <<'EOF'
          <?php
          return ['host'=>'127.0.0.1','port'=>3306,'name'=>'whisker_test','user'=>'root','pass'=>'root','charset'=>'utf8mb4','prefix'=>'wk_'];
          EOF
          cat > config/config.php <<'EOF'
          <?php
          return ['app_name'=>'Whisker','base_url'=>'http://127.0.0.1:8080','base_path'=>'/','debug'=>true,'timezone'=>'UTC','salt'=>'ci-test-salt'];
          EOF
      - name: Load schema
        run: mysql -h127.0.0.1 -uroot -proot --default-character-set=utf8mb4 whisker_test < sql/schema.sql
      - name: Run integration checks
        run: php tests/ci/integration.php
